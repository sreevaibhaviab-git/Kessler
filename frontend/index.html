 const list=document.querySelector('.planet-list');list.replaceChildren(...planets.map(p=>{const span=document.createElement('button');span.type='button';span.className=`planet-item${p.toLowerCase()===current?' active':''}`;span.textContent=p;span.addEventListener('click',()=>jumpTo(p.toLowerCase()));return span}));if(!firstRender)triggerClass(list,'is-switching');firstRender=false;
 document.querySelectorAll('.background').forEach(v=>v.classList.toggle('is-visible',v.id===s.background));themePlanet(current);
 const pv=$('portal-video'),pi=$('portal-image');if(!s.portal&&!s.image){pi.style.display='none';pv.style.display='none';pv.pause()}else if(s.image){pi.src=s.image;pi.style.display='block';pv.style.display='none';pv.pause()}else{pi.style.display='none';pv.style.display='block';if(pv.src!==s.portal){pv.pause();pv.src=s.portal;pv.load()}pv.play().catch(()=>{})}requestPortalDraw()}
function resizeCanvas(){refreshPortalRect();positionGpuPortal()}
// Media extends to viewport dimensions, offset behind the rounded mask. This
// approximates the original screen-locked footage while avoiding pixel copies.
function positionGpuPortal(){
 const rect=portalRect||$('portal').getBoundingClientRect(),e=expansion;
 const cx=rect.left+rect.width/2+(innerWidth/2-(rect.left+rect.width/2))*e;
 const cy=rect.top+rect.height/2+(innerHeight/2-(rect.top+rect.height/2))*e;
 const scale=e?1:maskScale;
 const w=Math.max(1,(rect.width+(innerWidth-rect.width)*e)*scale);
 const h=Math.max(1,(rect.height+(innerHeight-rect.height)*e)*scale);
 const left=cx-w/2,top=cy-h/2;
 gpuPortal.style.left=`${left}px`;gpuPortal.style.top=`${top}px`;
 gpuPortal.style.width=`${w}px`;gpuPortal.style.height=`${h}px`;
 gpuPortal.style.borderRadius=`${Math.max(0,90*(1-e)*scale)}px`;
 gpuPortal.style.opacity=String(canvasOpacity);
 gpuPortal.style.transform=e>.95?'none':`perspective(850px) rotateX(${rotX*(1-e)}deg) rotateY(${rotY*(1-e)}deg)`;
 for(const media of [portalVideo,portalImage,transitionVideo]){
   media.style.width=`${innerWidth}px`;media.style.height=`${innerHeight}px`;
   media.style.left=`${-left}px`;media.style.top=`${-top}px`;
 }
 portalVideo.style.visibility=!transitionActive&&!states[current].image?'visible':'hidden';
 portalImage.style.visibility=!transitionActive&&!!states[current].image?'visible':'hidden';
 genericPortal.classList.toggle('is-visible',!transitionActive&&!states[current].image&&!states[current].portal);
 transitionVideo.style.visibility=transitionActive?'visible':'hidden';
 gpuPortal.classList.toggle('transitioning',transitionActive);
}
let portalTickId=0,positionDirty=true;
function draw(t){
 if(document.hidden){portalTickId=0;return}
 const dt=Math.min(t-lastTick,40);lastTick=t;
 const nextX=rotX+(targetX-rotX)*Math.min(1,dt*.014);
 const nextY=rotY+(targetY-rotY)*Math.min(1,dt*.014);
 const changed=Math.abs(nextX-rotX)+Math.abs(nextY-rotY)>0.015;
 rotX=nextX;rotY=nextY;
 if(positionDirty||changed||busy){positionGpuPortal();positionDirty=false}
 // Idle: no canvas redraw, no perpetual JS animation needed.
 if(busy||changed||Math.abs(targetX-rotX)>.02||Math.abs(targetY-rotY)>.02)portalTickId=requestAnimationFrame(draw);
 else portalTickId=0;
}
function requestPortalDraw(){positionDirty=true;if(!portalTickId)portalTickId=requestAnimationFrame(draw)}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function animateValue(setter,duration){return new Promise(resolve=>{const start=performance.now();function frame(now){let t=Math.min((now-start)/duration,1);setter(ease(t));requestPortalDraw();if(t<1)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)})}
function waitForMedia(media,timeout=1600){return new Promise(resolve=>{if(media instanceof HTMLImageElement&&media.complete&&media.naturalWidth){resolve(true);return}if(media instanceof HTMLVideoElement&&media.readyState>=2){resolve(true);return}let done=false;const clean=v=>{if(done)return;done=true;clearTimeout(timer);media.removeEventListener('canplay',good);media.removeEventListener('loadeddata',good);media.removeEventListener('load',good);media.removeEventListener('error',bad);resolve(v)};const good=()=>clean(true),bad=()=>clean(false),timer=setTimeout(()=>clean(false),timeout);for(const ev of ['canplay','loadeddata','load'])media.addEventListener(ev,good,{once:true});media.addEventListener('error',bad,{once:true})})}
function revealMask(){triggerClass(root,'mask-revealing');maskScale=0;requestPortalDraw();return animateValue(v=>maskScale=v,1050)}
function revealPlanetContent(){triggerClass(root,'content-revealing')}
function delay(ms){return new Promise(r=>setTimeout(r,ms))}
async function startExperience(){const media=states[current].image?$('portal-image'):$('portal-video');if(states[current].image||states[current].portal)await waitForMedia(media,2600);await revealMask();document.body.classList.add('intro-ready');await delay(850);revealPlanetContent()}
async function runPreloader(){const video=$('preloader-video'),counter=$('preloader-count'),logo=$('floating-logo');let finished=false;const finish=()=>{if(finished)return;finished=true;$('preloader-value').textContent='100';counter.classList.add('is-leaving');logo.classList.add('is-docked');$('preloader').classList.add('is-background');video.pause();document.body.classList.add('preload-complete');startExperience().catch(console.error);setTimeout(()=>counter.remove(),750);setTimeout(()=>logo.classList.add('is-settled'),2000)};
 const ready=await new Promise(resolve=>{if(video.readyState>=1&&Number.isFinite(video.duration)){resolve(true);return}const timer=setTimeout(()=>resolve(false),4000);video.addEventListener('loadedmetadata',()=>{clearTimeout(timer);resolve(true)},{once:true});video.addEventListener('error',()=>{clearTimeout(timer);resolve(false)},{once:true})});if(!ready||!video.duration){finish();return}
 video.playbackRate=Math.max(.25,video.duration/3);let raf=0;function update(){if(finished)return;$('preloader-value').textContent=String(Math.min(99,Math.round(video.currentTime/video.duration*100)));raf=requestAnimationFrame(update)};video.addEventListener('ended',()=>{cancelAnimationFrame(raf);finish()},{once:true});video.play().then(()=>{raf=requestAnimationFrame(update)}).catch(finish);setTimeout(finish,Math.max(6500,video.duration/video.playbackRate*1000+2500))}
async function travel(){if(busy)return;busy=true;targetX=targetY=0;const next=states[current].next.toLowerCase(),v=$('transition-video');let committed=false;
 try{if(!states[current].portal){root.classList.add('is-transitioning');await animateValue(x=>expansion=x,650);current=next;render();expansion=0;maskScale=0;root.classList.remove('is-transitioning');await revealMask();revealPlanetContent();committed=true;return;}v.src=states[current].portal;v.load();root.classList.add('is-loading');await waitForMedia(v,1600);root.classList.remove('is-loading','content-revealing','mask-revealing');root.classList.add('is-transitioning');v.currentTime=0;v.playbackRate=1.3;canvasOpacity=1;transitionActive=true;requestPortalDraw();
 const playResult=v.play();if(playResult)await playResult.catch(()=>{});await animateValue(x=>expansion=x,1100);
 if(v.readyState>=2&&!v.ended){await Promise.race([new Promise(r=>v.addEventListener('ended',r,{once:true})),delay(5000)])}
 current=next;root.classList.add('is-committing');render();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 transitionActive=false;expansion=0;maskScale=0;canvasOpacity=1;root.classList.remove('is-transitioning','is-committing');requestPortalDraw();committed=true;
 const reveal=revealMask();setTimeout(revealPlanetContent,100);await reveal;await delay(450);
 }catch(error){console.error('Portal transition failed:',error);transitionActive=false;expansion=0;maskScale=1;canvasOpacity=1;root.classList.remove('is-transitioning','is-committing');}
 finally{root.classList.remove('is-loading');v.pause();v.removeAttribute('src');v.load();busy=false;if(!committed){root.classList.add('content-revealing','mask-revealing')}}}
async function jumpTo(key){if(busy||key===current||!states[key])return;busy=true;try{root.classList.remove('content-revealing','mask-revealing');root.classList.add('is-transitioning');await delay(250);current=key;render();maskScale=0;root.classList.remove('is-transitioning');await revealMask();revealPlanetContent()}finally{busy=false}}
const cursor=document.querySelector('.custom-cursor');
let cursorRaf=0;
function cursorLoop(){
 cursorRaf=0;if(!hasPointer||document.hidden)return;
 cursorX+=(pointerX-cursorX)*.28;cursorY+=(pointerY-cursorY)*.28;
 cursor.style.transform=`translate3d(${cursorX}px,${cursorY}px,0)`;
 if(Math.abs(pointerX-cursorX)+Math.abs(pointerY-cursorY)>.5)cursorRaf=requestAnimationFrame(cursorLoop);
}
function requestCursorDraw(){if(!cursorRaf)cursorRaf=requestAnimationFrame(cursorLoop)}
if(matchMedia('(pointer:fine)').matches){document.addEventListener('pointermove',e=>{pointerX=e.clientX;pointerY=e.clientY;if(!hasPointer){cursorX=pointerX;cursorY=pointerY;hasPointer=true}cursor.classList.add('is-visible');if(!busy){targetY=(e.clientX/innerWidth-.5)*37.4;targetX=(e.clientY/innerHeight-.5)*-33;requestPortalDraw()}requestCursorDraw()});document.addEventListener('pointerleave',()=>{cursor.classList.remove('is-visible');targetX=targetY=0;requestPortalDraw()});$('portal').addEventListener('pointerenter',()=>cursor.classList.add('is-enter'));$('portal').addEventListener('pointerleave',()=>{cursor.classList.remove('is-enter');targetX=targetY=0;requestPortalDraw()})}
$('portal').addEventListener('click',travel);
$('portal').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();travel()}});
// Keep the original nav semantics, but make the Menu button operate a real compact nav.
const menu=document.querySelector('.menu');menu.addEventListener('click',()=>{const nav=document.querySelector('.nav');const visible=getComputedStyle(nav).display!=='none';nav.style.display=visible?'none':'flex';nav.style.position='absolute';nav.style.right='0';nav.style.top='52px';nav.style.zIndex='5';nav.style.flexDirection=innerWidth<640?'column':'row';menu.setAttribute('aria-expanded',String(!visible))});
for(const a of document.querySelectorAll('.nav a'))a.addEventListener('click',e=>{e.preventDefault();document.querySelector('.nav a.active')?.classList.remove('active');a.classList.add('active');if(a.hash==='#planets')document.querySelector('.planet-list')?.classList.add('is-switching')});
for(const v of document.querySelectorAll('.background')){v.pause();try{v.currentTime=0}catch{}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){$('portal-video').pause();$('transition-video').pause()}else {if(!busy&&!states[current].image)$('portal-video').play().catch(()=>{});requestPortalDraw()}});window.addEventListener('resize',resizeCanvas,{passive:true});resizeCanvas();render();requestPortalDraw();runPreloader();
})();
